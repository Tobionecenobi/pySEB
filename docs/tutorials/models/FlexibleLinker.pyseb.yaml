format: pyseb-subunit
schema_version: 1
id: tutorial/FlexibleLinker
api_name: FlexibleLinker
model_version: "1.0.0"

metadata:
  title: Flexible linker
  description: A user-defined Gaussian-chain linker for the YAML workflow tutorial.
  authors: []
  citations:
    - P. Debye, J. Phys. Colloid Chem. 51 (1947) 18-32.
  license: BSD-3-Clause

parameters:
  Rg:
    unit: length
    description: Radius of gyration

variables:
  x: "(q * Rg)^2"

definitions:
  form: "2 * (exp(-x) - 1 + x) / x^2"
  endAmplitude: "(1 - exp(-x)) / x"

references:
  specific: [end1, end2]
  distributed: []

expressions:
  form_factor: form
  amplitudes:
    end1: endAmplitude
    end2: endAmplitude
  phases:
    - references: [end1, end2]
      expression: "exp(-x)"

sizes:
  radius_of_gyration_squared: "Rg^2"
  reference_to_scatterer:
    end1: "3 * Rg^2"
    end2: "3 * Rg^2"
  reference_to_reference:
    - references: [end1, end2]
      expression: "6 * Rg^2"

validation:
  absolute_tolerance: 1.0e-10
  relative_tolerance: 1.0e-8
  cases:
    - name: zero-angle normalization
      quantity: form_factor
      parameters: {Rg: 2.0}
      q: 0.0
      expected: 1.0
    - name: end-to-end phase
      quantity: phase
      parameters: {Rg: 2.0}
      references: [end1, end2]
      q: 0.5
      expected: 0.36787944117144233
    - name: radius of gyration
      quantity: radius_of_gyration_squared
      parameters: {Rg: 2.0}
      expected: 4.0

visualization:
  geometry:
    contour:
      kind: random_walk
      samples: 96
      closure: open
      target_rg: Rg
  references:
    end1: {kind: curve_fraction, geometry: contour, fraction: 0}
    end2: {kind: curve_fraction, geometry: contour, fraction: 1}
