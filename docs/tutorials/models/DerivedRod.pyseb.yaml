format: pyseb-subunit
schema_version: 1
id: tutorial/DerivedRod
api_name: DerivedRod
model_version: 1.0.0
metadata:
  title: Uniform rod derived from distance vectors
  description: Teaching model derived in the distance-vector tutorial, with three
    fixed attachment references.
  authors: []
  citations:
  - T. Neugebauer, Ann. Phys. (Leipzig) 42, 509 (1943).
  - P. I. Teixeira, D. J. Read, and T. C. B. McLeish, J. Chem. Phys. 126, 074901 (2007).
  license: BSD-3-Clause
parameters:
  L:
    unit: length
    description: Rod length
variables:
  x: q * L
definitions:
  Fend: six(x)
  Fmiddle: six(x / 2)
  F: 2 * (cos(x) - 1) / x^2 + 2 * six(x)
references:
  specific:
  - end1
  - end2
  - middle
  distributed: []
expressions:
  form_factor: F
  amplitudes:
    end1: Fend
    end2: Fend
    middle: Fmiddle
  phases:
  - references:
    - end1
    - end2
    expression: sin(x) / x
  - references:
    - end1
    - middle
    expression: 2 * sin(x / 2) / x
  - references:
    - end2
    - middle
    expression: 2 * sin(x / 2) / x
sizes:
  radius_of_gyration_squared: L^2 / 12
  reference_to_scatterer:
    end1: L^2 / 3
    end2: L^2 / 3
    middle: L^2 / 12
  reference_to_reference:
  - references:
    - end1
    - end2
    expression: L^2
  - references:
    - end1
    - middle
    expression: L^2 / 4
  - references:
    - end2
    - middle
    expression: L^2 / 4
validation:
  absolute_tolerance: 1.0e-10
  relative_tolerance: 1.0e-08
  cases:
  - name: normalized zero-angle form factor
    quantity: form_factor
    parameters:
      L: 10.0
    q: 0.0
    expected: 1.0
  - name: radius of gyration
    quantity: radius_of_gyration_squared
    parameters:
      L: 10.0
    expected: 8.333333333333334
  - name: end-to-scatterer distance
    quantity: reference_to_scatterer
    parameters:
      L: 10.0
    references:
    - end1
    expected: 33.333333333333336
  - name: end-to-end phase at zero angle
    quantity: phase
    parameters:
      L: 10.0
    references:
    - end1
    - end2
    q: 0.0
    expected: 1.0
  - name: end-to-end distance
    quantity: reference_to_reference
    parameters:
      L: 10.0
    references:
    - end1
    - end2
    expected: 100.0
  - name: end-to-middle distance
    quantity: reference_to_reference
    parameters:
      L: 10.0
    references:
    - end1
    - middle
    expected: 25.0
  - name: pair integral at nonzero q
    quantity: form_factor
    parameters:
      L: 4.0
    q: 0.7
    expected: 0.8131755379487358
  - name: midpoint integral at nonzero q
    quantity: amplitude
    parameters:
      L: 4.0
    q: 0.7
    expected: 0.8973048091280129
    references:
    - middle
  - name: end1 shifted integral at nonzero q
    quantity: amplitude
    parameters:
      L: 4.0
    q: 0.7
    expected: 0.6543202103861865
    references:
    - end1
  - name: end2 shifted integral at nonzero q
    quantity: amplitude
    parameters:
      L: 4.0
    q: 0.7
    expected: 0.6543202103861865
    references:
    - end2
  - name: end-to-end orientation integral
    quantity: phase
    parameters:
      L: 4.0
    q: 0.7
    expected: 0.11963862505568039
    references:
    - end1
    - end2
  - name: end-to-midpoint orientation integral
    quantity: phase
    parameters:
      L: 4.0
    q: 0.7
    expected: 0.7038926642774717
    references:
    - end1
    - middle
visualization:
  geometry:
    contour:
      kind: curve
      u:
        lower: -L / 2
        upper: L / 2
      coordinates:
      - '0'
      - '0'
      - u
  references:
    end1:
      kind: curve_fraction
      geometry: contour
      fraction: 0
    middle:
      kind: curve_fraction
      geometry: contour
      fraction: 0.5
    end2:
      kind: curve_fraction
      geometry: contour
      fraction: 1
