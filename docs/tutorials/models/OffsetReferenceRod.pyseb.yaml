format: pyseb-subunit
schema_version: 1
id: tutorial/OffsetReferenceRod
api_name: OffsetReferenceRod
model_version: 1.0.0
metadata:
  title: Thin rod with two symmetric third references
  description: Extends pyseb/ThinRod with fixed references at one-third and two-thirds of its length.
  authors: []
  citations:
  - T. Neugebauer, Ann. Phys. (Leipzig) 42, 509 (1943).
  - P. I. Teixeira, D. J. Read, and T. C. B. McLeish, J. Chem. Phys. 126, 074901 (2007).
  license: BSD-3-Clause
parameters:
  L:
    unit: length
    description: Rod length
variables:
  x: q * L
definitions:
  Fend: six(x)
  Fmiddle: six(x / 2)
  F: 2 * (cos(x) - 1) / x^2 + 2 * six(x)
  Fthird: (six(x / 3) + 2 * six(2 * x / 3)) / 3
references:
  specific:
  - end1
  - end2
  - middle
  - third1
  - third2
  distributed:
  - contour
expressions:
  form_factor: F
  amplitudes:
    end1: Fend
    end2: Fend
    middle: Fmiddle
    contour: F
    third1: Fthird
    third2: Fthird
  phases:
  - references:
    - end1
    - end2
    expression: sin(x) / x
  - references:
    - end1
    - middle
    expression: 2 * sin(x / 2) / x
  - references:
    - end2
    - middle
    expression: 2 * sin(x / 2) / x
  - references:
    - contour
    - end1
    expression: Fend
  - references:
    - contour
    - end2
    expression: Fend
  - references:
    - contour
    - middle
    expression: Fmiddle
  - references:
    - contour
    - contour
    expression: F
  - references:
    - third1
    - end1
    expression: sinc(x / 3)
  - references:
    - third1
    - end2
    expression: sinc(2 * x / 3)
  - references:
    - third1
    - middle
    expression: sinc(x / 6)
  - references:
    - third1
    - contour
    expression: Fthird
  - references:
    - third2
    - end1
    expression: sinc(2 * x / 3)
  - references:
    - third2
    - end2
    expression: sinc(x / 3)
  - references:
    - third2
    - middle
    expression: sinc(x / 6)
  - references:
    - third2
    - contour
    expression: Fthird
  - references:
    - third1
    - third2
    expression: sinc(x / 3)
sizes:
  radius_of_gyration_squared: L^2 / 12
  reference_to_scatterer:
    end1: L^2 / 3
    end2: L^2 / 3
    middle: L^2 / 12
    contour: L^2 / 6
    third1: L^2 / 9
    third2: L^2 / 9
  reference_to_reference:
  - references:
    - end1
    - end2
    expression: L^2
  - references:
    - end1
    - middle
    expression: L^2 / 4
  - references:
    - end2
    - middle
    expression: L^2 / 4
  - references:
    - contour
    - end1
    expression: L^2 / 3
  - references:
    - contour
    - end2
    expression: L^2 / 3
  - references:
    - contour
    - middle
    expression: L^2 / 12
  - references:
    - contour
    - contour
    expression: L^2 / 6
  - references:
    - third1
    - end1
    expression: L^2 / 9
  - references:
    - third1
    - end2
    expression: 4 * L^2 / 9
  - references:
    - third1
    - middle
    expression: L^2 / 36
  - references:
    - third1
    - contour
    expression: L^2 / 9
  - references:
    - third2
    - end1
    expression: 4 * L^2 / 9
  - references:
    - third2
    - end2
    expression: L^2 / 9
  - references:
    - third2
    - middle
    expression: L^2 / 36
  - references:
    - third2
    - contour
    expression: L^2 / 9
  - references:
    - third1
    - third2
    expression: L^2 / 9
validation:
  absolute_tolerance: 1.0e-10
  relative_tolerance: 1.0e-08
  cases:
  - name: normalized zero-angle form factor
    quantity: form_factor
    parameters:
      L: 10.0
    q: 0.0
    expected: 1.0
  - name: radius of gyration
    quantity: radius_of_gyration_squared
    parameters:
      L: 10.0
    expected: 8.333333333333334
  - name: end-to-scatterer distance
    quantity: reference_to_scatterer
    parameters:
      L: 10.0
    references:
    - end1
    expected: 33.333333333333336
  - name: end-to-end phase at zero angle
    quantity: phase
    parameters:
      L: 10.0
    references:
    - end1
    - end2
    q: 0.0
    expected: 1.0
  - name: end-to-end distance
    quantity: reference_to_reference
    parameters:
      L: 10.0
    references:
    - end1
    - end2
    expected: 100.0
  - name: end-to-middle distance
    quantity: reference_to_reference
    parameters:
      L: 10.0
    references:
    - end1
    - middle
    expected: 25.0
  - name: third1 amplitude at zero angle
    quantity: amplitude
    parameters:
      L: 9.0
    references:
    - third1
    expected: 1.0
    q: 0.0
  - name: third1 amplitude from independent integration
    quantity: amplitude
    parameters:
      L: 9.0
    references:
    - third1
    expected: 0.8504986823899593
    q: 0.3333333333333333
  - name: third1 phase to nearest end
    quantity: phase
    parameters:
      L: 9.0
    references:
    - third1
    - end1
    expected: 0.8414709848078965
    q: 0.3333333333333333
  - name: third1 phase to uniform contour
    quantity: phase
    parameters:
      L: 9.0
    references:
    - third1
    - contour
    expected: 0.8504986823899593
    q: 0.3333333333333333
  - name: third1 scatterer mean square distance
    quantity: reference_to_scatterer
    parameters:
      L: 9.0
    references:
    - third1
    expected: 9.0
  - name: third1 middle squared distance
    quantity: reference_to_reference
    parameters:
      L: 9.0
    references:
    - third1
    - middle
    expected: 2.25
  - name: third2 amplitude at zero angle
    quantity: amplitude
    parameters:
      L: 9.0
    references:
    - third2
    expected: 1.0
    q: 0.0
  - name: third2 amplitude from independent integration
    quantity: amplitude
    parameters:
      L: 9.0
    references:
    - third2
    expected: 0.8504986823899593
    q: 0.3333333333333333
  - name: third2 phase to nearest end
    quantity: phase
    parameters:
      L: 9.0
    references:
    - third2
    - end2
    expected: 0.8414709848078965
    q: 0.3333333333333333
  - name: third2 phase to uniform contour
    quantity: phase
    parameters:
      L: 9.0
    references:
    - third2
    - contour
    expected: 0.8504986823899593
    q: 0.3333333333333333
  - name: third2 scatterer mean square distance
    quantity: reference_to_scatterer
    parameters:
      L: 9.0
    references:
    - third2
    expected: 9.0
  - name: third2 middle squared distance
    quantity: reference_to_reference
    parameters:
      L: 9.0
    references:
    - third2
    - middle
    expected: 2.25
  - name: third1 to third2 phase
    quantity: phase
    parameters:
      L: 9.0
    references:
    - third1
    - third2
    expected: 0.8414709848078965
    q: 0.3333333333333333
  - name: third1 to third2 reference_to_reference
    quantity: reference_to_reference
    parameters:
      L: 9.0
    references:
    - third1
    - third2
    expected: 9.0
visualization:
  geometry:
    contour:
      kind: curve
      u:
        lower: -L / 2
        upper: L / 2
      coordinates:
      - '0'
      - '0'
      - u
  references:
    end1:
      kind: curve_fraction
      geometry: contour
      fraction: 0
    middle:
      kind: curve_fraction
      geometry: contour
      fraction: 0.5
    end2:
      kind: curve_fraction
      geometry: contour
      fraction: 1
    contour:
      kind: distributed
      geometry: contour
      sampling: uniform_parameter
    third1:
      kind: curve_fraction
      geometry: contour
      fraction: 0.3333333333333333
    third2:
      kind: curve_fraction
      geometry: contour
      fraction: 0.6666666666666666
