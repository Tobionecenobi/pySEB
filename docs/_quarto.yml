project:
  type: website
  output-dir: _site
  pre-render: python3 _prepare_cache.py
  post-render: python3 _prepare_cache.py --record-outputs
  resources:
    - tutorials/models/*.pyseb.yaml
    - tutorials/data/*.csv
    - tutorials/data/*.pdb
    - tutorials/data/SASDATA-LICENSE.txt
    - tutorials/data/TITIN-DATA-NOTICE.txt
    - tutorials/data/titin-results/
    - tutorials/data/f127/F127_0_merged_1.txt
    - tutorials/data/f127/LICENSE
    - tutorials/generated/f127-corona/*.usda
    - tutorials/generated/f127-corona/*.html
    - tutorials/generated/f127-corona/plotly.min.js
  render:
    - index.qmd
    - about.qmd
    - using-pyseb.qmd
    - theory.qmd
    - tutorials/index.qmd
    - tutorials/introduction.qmd
    - tutorials/first-model.qmd
    - tutorials/reference-points.qmd
    - tutorials/diblock-copolymer.qmd
    - tutorials/rod-coil.qmd
    - tutorials/comb-polymer.qmd
    - tutorials/micelle.qmd
    - tutorials/nested-structures.qmd
    - tutorials/nested-hierarchy.qmd
    - tutorials/random-walk-rods.qmd
    - tutorials/parameter-sweeps.qmd
    - tutorials/fit-real-sans-data.qmd
    - tutorials/sans-size-distributions.qmd
    - tutorials/sans-interactions-resolution.qmd
    - tutorials/fit-linked-titin.qmd
    - tutorials/titin-coordinate-domains.qmd
    - tutorials/titin-hydration.qmd
    - tutorials/titin-relative-weights.qmd
    - tutorials/fit-f127-corona.qmd
    - tutorials/fit-f127-data.qmd
    - tutorials/compare-f127-coronas.qmd
    - tutorials/pdb-polymer.qmd
    - tutorials/mixed-model-evaluation.qmd
    - tutorials/symbolic-expressions.qmd
    - tutorials/scattering-quantities.qmd
    - tutorials/scattering-from-phases.qmd
    - tutorials/figure10-linear-chains.qmd
    - tutorials/figure11-dendrimers.qmd
    - tutorials/figure12-surface-attachments.qmd
    - tutorials/figure13-star-chain.qmd
    - tutorials/custom-yaml-workflow.qmd
    - tutorials/define-custom-subunit.qmd
    - tutorials/add-subunit-reference.qmd
    - tutorials/save-load-model.qmd
    - tutorials/pyseb_tutorial.qmd
    - tutorials/cpp_tutorials.qmd
    - file-defined-subunits.qmd
    - visualization.qmd
    - sasmodels.qmd

website:
  title: "pySEB"
  site-url: "https://tobionecenobi.github.io/pySEB/"
  repo-url: "https://github.com/Tobionecenobi/pySEB"
  repo-subdir: "docs"
  repo-actions: [edit, source, issue]
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: tutorials/index.qmd
        text: Tutorials
      - href: using-pyseb.qmd
        text: Using pySEB
      - href: theory.qmd
        text: Theory
      - href: https://github.com/Tobionecenobi/pySEB/wiki
        text: Reference
      - href: about.qmd
        text: About
  sidebar:
    - title: "Tutorials"
      style: docked
      search: true
      contents:
        - tutorials/index.qmd
        - section: "Start here"
          contents:
            - tutorials/introduction.qmd
            - tutorials/first-model.qmd
            - tutorials/reference-points.qmd
            - tutorials/diblock-copolymer.qmd
        - section: "Build structures"
          contents:
            - tutorials/rod-coil.qmd
            - tutorials/comb-polymer.qmd
            - tutorials/micelle.qmd
            - tutorials/random-walk-rods.qmd
            - tutorials/nested-structures.qmd
            - tutorials/nested-hierarchy.qmd
            - tutorials/parameter-sweeps.qmd
        - section: "Understand scattering"
          contents:
            - tutorials/scattering-quantities.qmd
            - tutorials/scattering-from-phases.qmd
            - tutorials/symbolic-expressions.qmd
        - section: "Custom subunits and models"
          contents:
            - tutorials/custom-yaml-workflow.qmd
            - tutorials/define-custom-subunit.qmd
            - tutorials/add-subunit-reference.qmd
            - tutorials/save-load-model.qmd
            - tutorials/pdb-polymer.qmd
        - section: "Fit experimental data"
          contents:
            - section: "SANS contrast variation"
              contents:
                - tutorials/fit-real-sans-data.qmd
                - tutorials/sans-size-distributions.qmd
                - tutorials/sans-interactions-resolution.qmd
            - section: "F127 polymer coronas"
              contents:
                - tutorials/fit-f127-corona.qmd
                - tutorials/fit-f127-data.qmd
                - tutorials/compare-f127-coronas.qmd
            - section: "Titin doublets"
              contents:
                - tutorials/fit-linked-titin.qmd
                - tutorials/titin-coordinate-domains.qmd
                - tutorials/titin-hydration.qmd
                - tutorials/titin-relative-weights.qmd
        - section: "Advanced tutorials"
          contents:
            - tutorials/mixed-model-evaluation.qmd
            - sasmodels.qmd
        - section: "Published structures"
          contents:
            - tutorials/figure10-linear-chains.qmd
            - tutorials/figure11-dendrimers.qmd
            - tutorials/figure12-surface-attachments.qmd
            - tutorials/figure13-star-chain.qmd
        - section: "Extended guides"
          contents:
            - tutorials/pyseb_tutorial.qmd
            - tutorials/cpp_tutorials.qmd
    - title: "Using pySEB"
      style: docked
      search: true
      contents:
        - using-pyseb.qmd
        - visualization.qmd
        - file-defined-subunits.qmd
        - href: https://github.com/Tobionecenobi/pySEB/wiki/Troubleshooting-and-FAQ
          text: Troubleshooting
    - title: "Theory"
      style: docked
      search: true
      contents:
        - theory.qmd
        - href: https://github.com/Tobionecenobi/pySEB/wiki/Core-Concepts
          text: Core concepts
        - href: https://github.com/Tobionecenobi/pySEB/wiki/Theory-Overview
          text: Formalism
  page-footer:
    left: "pySEB documentation"
    right:
      - text: "Source"
        href: "https://github.com/Tobionecenobi/pySEB"
      - text: "Wiki"
        href: "https://github.com/Tobionecenobi/pySEB/wiki"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    respect-user-color-scheme: true
    toc: true
    code-tools: true
    code-copy: true
    fig-format: svg
    link-external-newwindow: true

execute:
  cache: true
  echo: true
  warning: false
  error: false
