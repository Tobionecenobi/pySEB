format: pyseb-subunit
schema_version: 1
id: pyseb/Spheroid
api_name: Spheroid
model_version: "1.0.0"

metadata:
  title: Axial spheroid
  description: A homogeneous spheroid with equatorial radius a and polar radius c. Surface references are distributed uniformly in the angular parameterization (theta, phi), rather than uniformly by area.
  authors: []
  citations: []
  license: BSD-3-Clause

parameters:
  a:
    unit: length
    description: Equatorial semi-axis
  c:
    unit: length
    description: Polar semi-axis

variables:
  x: "q * a"
  y: "q * c"

integrals:
  volumeFormFactor:
    variable: theta
    lower: "0"
    upper: "pi / 2"
    integrand: "sin(theta) * (3 * (sin(sqrt(x^2 * sin(theta)^2 + y^2 * cos(theta)^2)) - sqrt(x^2 * sin(theta)^2 + y^2 * cos(theta)^2) * cos(sqrt(x^2 * sin(theta)^2 + y^2 * cos(theta)^2))) / sqrt(x^2 * sin(theta)^2 + y^2 * cos(theta)^2)^3)^2"
  centerAmplitude:
    variable: theta
    lower: "0"
    upper: "pi / 2"
    integrand: "sin(theta) * (3 * (sin(sqrt(x^2 * sin(theta)^2 + y^2 * cos(theta)^2)) - sqrt(x^2 * sin(theta)^2 + y^2 * cos(theta)^2) * cos(sqrt(x^2 * sin(theta)^2 + y^2 * cos(theta)^2))) / sqrt(x^2 * sin(theta)^2 + y^2 * cos(theta)^2)^3)"
  poleAmplitude:
    variable: theta
    lower: "0"
    upper: "pi / 2"
    integrand: "sin(theta) * (3 * (sin(sqrt(x^2 * sin(theta)^2 + y^2 * cos(theta)^2)) - sqrt(x^2 * sin(theta)^2 + y^2 * cos(theta)^2) * cos(sqrt(x^2 * sin(theta)^2 + y^2 * cos(theta)^2))) / sqrt(x^2 * sin(theta)^2 + y^2 * cos(theta)^2)^3) * cos(y * cos(theta) / 1)"
  surfaceAmplitude:
    variables:
      - {variable: orientation, lower: "0", upper: "pi / 2"}
      - {variable: theta, lower: "0", upper: "pi"}
    integrand: "sin(orientation) * sin(theta) * (3 * (sin(sqrt((q * a)^2 * sin(orientation)^2 + (q * c)^2 * cos(orientation)^2)) - sqrt((q * a)^2 * sin(orientation)^2 + (q * c)^2 * cos(orientation)^2) * cos(sqrt((q * a)^2 * sin(orientation)^2 + (q * c)^2 * cos(orientation)^2))) / sqrt((q * a)^2 * sin(orientation)^2 + (q * c)^2 * cos(orientation)^2)^3) * bessel_j0(q * a * sin(theta) * sin(orientation)) * cos(q * c * cos(theta) * cos(orientation)) / 2"
  poleSurfacePhase:
    variables:
      - {variable: theta, lower: "0", upper: "pi"}
      - {variable: phi, lower: "0", upper: "2 * pi"}
    integrand: "sin(theta) * sinc(q * sqrt(a^2 * sin(theta)^2 + c^2 * (cos(theta) - 1)^2)) / (4 * pi)"
  surfaceSurfacePhase:
    variables:
      - {variable: theta1, lower: "0", upper: "pi"}
      - {variable: theta2, lower: "0", upper: "pi"}
      - {variable: phi, lower: "0", upper: "2 * pi"}
    integrand: "sin(theta1) * sin(theta2) * sinc(q * sqrt(a^2 * (sin(theta1)^2 + sin(theta2)^2 - 2 * sin(theta1) * sin(theta2) * cos(phi)) + c^2 * (cos(theta1) - cos(theta2))^2)) / (8 * pi)"

references:
  specific: [center, pole]
  distributed: [surface]

expressions:
  form_factor: volumeFormFactor
  amplitudes:
    center: centerAmplitude
    pole: poleAmplitude
    surface: surfaceAmplitude
  phases:
    - references: [center, pole]
      expression: "sinc(y)"
    - references: [center, surface]
      expression: surfaceAmplitude
    - references: [pole, surface]
      expression: poleSurfacePhase
    - references: [surface, surface]
      expression: surfaceSurfacePhase

sizes:
  radius_of_gyration_squared: "(2 * a^2 + c^2) / 5"
  reference_to_scatterer:
    center: "(2 * a^2 + c^2) / 5"
    pole: "(2 * a^2 + c^2) / 5 + c^2"
    surface: "(2 * a^2 + c^2) / 3"
  reference_to_reference:
    - references: [center, pole]
      expression: "c^2"
    - references: [center, surface]
      expression: "(2 * a^2 + c^2) / 3"
    - references: [pole, surface]
      expression: "(2 * a^2 + 4 * c^2) / 3"
    - references: [surface, surface]
      expression: "2 * (2 * a^2 + c^2) / 3"

validation:
  absolute_tolerance: 1.0e-10
  relative_tolerance: 1.0e-8
  cases:
    - name: normalized form factor
      quantity: form_factor
      parameters: {a: 2.0, c: 3.0}
      q: 0.0
      expected: 1.0
    - name: normalized surface amplitude
      quantity: amplitude
      parameters: {a: 2.0, c: 3.0}
      references: [surface]
      q: 0.0
      expected: 1.0
    - name: normalized surface phase
      quantity: phase
      parameters: {a: 2.0, c: 3.0}
      references: [surface, surface]
      q: 0.0
      expected: 1.0
    - name: sphere-limit form factor at finite q
      quantity: form_factor
      parameters: {a: 2.0, c: 2.0}
      q: 0.5
      expected: 0.8163231585688645
    - name: sphere-limit surface amplitude at finite q
      quantity: amplitude
      parameters: {a: 2.0, c: 2.0}
      references: [surface]
      q: 0.5
      expected: 0.760274114582191
    - name: sphere-limit surface phase at finite q
      quantity: phase
      parameters: {a: 2.0, c: 2.0}
      references: [surface, surface]
      q: 0.5
      expected: 0.7080734182735712
    - name: volume radius of gyration
      quantity: radius_of_gyration_squared
      parameters: {a: 2.0, c: 3.0}
      expected: 3.4
    - name: center to surface distance
      quantity: reference_to_scatterer
      parameters: {a: 2.0, c: 3.0}
      references: [surface]
      expected: 5.666666666666667
    - name: center to pole distance
      quantity: reference_to_reference
      parameters: {a: 2.0, c: 3.0}
      references: [center, pole]
      expected: 9.0
