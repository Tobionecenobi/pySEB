format: pyseb-subunit
schema_version: 1
id: pyseb/Point
api_name: Point
model_version: "1.0.0"

metadata:
  title: Point scatterer
  description: An ideal zero-size scatterer with adjustable excess scattering length beta.
  authors: []
  citations: []
  license: BSD-3-Clause

parameters: {}
references:
  specific: [point]
  distributed: []

expressions:
  form_factor: "1"
  amplitudes:
    point: "1"
  phases: []

sizes:
  radius_of_gyration_squared: "0"
  reference_to_scatterer:
    point: "0"
  reference_to_reference: []

validation:
  absolute_tolerance: 1.0e-12
  relative_tolerance: 1.0e-10
  cases:
    - name: normalized zero-angle scattering
      quantity: form_factor
      q: 0.0
      expected: 1.0
    - name: normalized finite-q scattering
      quantity: form_factor
      q: 10.0
      expected: 1.0
    - name: squared scattering length
      quantity: form_factor_unnormalized
      beta: -2.0
      q: 0.5
      expected: 4.0
    - name: point amplitude
      quantity: amplitude
      references: [point]
      q: 0.5
      expected: 1.0

    - name: point phase
      quantity: phase
      references: [point, point]
      q: 0.25
      expected: 1.0
    - name: zero size
      quantity: radius_of_gyration_squared
      expected: 0.0

visualization:
  geometry: {}
  references:
    point: {kind: fixed, position: [0, 0, 0]}
